# QDIA Export — déploiement gratuit Render
# https://render.com
#
# Render Dashboard → New → Blueprint → repo MEHRILabs/Qdia-export
# Renseignez GROQ_API_KEY, GOOGLE_CLIENT_ID, etc. après le premier déploiement.

databases:
  - name: qdia-db
    plan: free
    databaseName: qdia_export
    user: qdia

services:
  - type: web
    name: qdia-export
    runtime: node
    plan: free
    buildCommand: >-
      corepack enable &&
      pnpm install --no-frozen-lockfile
      --filter @workspace/qdia-export
      --filter @workspace/api-server
      --filter @workspace/db
      --filter workspace &&
      pnpm -C artifacts/api-server build &&
      pnpm -C lib/db run push &&
      node ./scripts/seed.mjs &&
      BASE_PATH=/ PORT=10000 VITE_API_URL=
      VITE_GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      pnpm -C artifacts/qdia-export build
    startCommand: cd artifacts/api-server && SERVE_WEB=1 node --enable-source-maps ./dist/index.mjs
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: SERVE_WEB
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: qdia-db
          property: connectionString
      - key: DATABASE_SSL_REJECT_UNAUTHORIZED
        value: "false"
      - key: JWT_SECRET
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: VITE_GOOGLE_CLIENT_ID
        fromService:
          type: web
          name: qdia-export
          envVarKey: GOOGLE_CLIENT_ID
