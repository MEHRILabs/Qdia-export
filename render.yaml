# QDIA Export — déploiement gratuit Render
# https://render.com

databases:
  - name: qdia-db
    plan: free
    databaseName: qdia_export
    user: qdia

services:
  - type: web
    name: qdia-export
    runtime: node
    plan: free
    buildCommand: bash scripts/render-build.sh
    startCommand: bash scripts/render-start.sh
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: SERVE_WEB
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: qdia-db
          property: connectionString
      - key: DATABASE_SSL_REJECT_UNAUTHORIZED
        value: "false"
      - key: JWT_SECRET
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: VITE_GOOGLE_CLIENT_ID
        fromService:
          type: web
          name: qdia-export
          envVarKey: GOOGLE_CLIENT_ID
